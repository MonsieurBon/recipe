<app-bottom-sheet>
  <div class="user-head">
    <span class="avatar" aria-hidden="true">{{ data.user.username.charAt(0) }}</span>
    <span class="who">
      <span class="name">{{ data.user.username }}</span>
      <span class="email">{{ data.user.email }}</span>
    </span>
  </div>
  <div class="edit-row">
    <mat-slide-toggle
      class="row-toggle"
      labelPosition="before"
      hideIcon
      data-test-id="activeToggle"
      [aria-label]="'admin.activeToggleAria' | translate: { username: data.user.username }"
      [checked]="enabled()"
      [disabled]="data.isOwn"
      (change)="toggleEnabled($event)"
      >{{ 'admin.activeLabel' | translate }}</mat-slide-toggle
    >
  </div>
  <div class="edit-row">
    <span class="row-label">{{ 'admin.roleLabel' | translate }}</span>
    <mat-form-field class="selval" appearance="outline" subscriptSizing="dynamic">
      <mat-select
        data-test-id="roleSelect"
        panelClass="selval-panel"
        [aria-label]="'admin.roleSelectAria' | translate: { username: data.user.username }"
        [value]="role()"
        [disabled]="data.isOwn"
        (selectionChange)="changeRole($event)"
      >
        <mat-option value="USER">{{ 'admin.role.user' | translate }}</mat-option>
        <mat-option value="ADMIN">{{ 'admin.role.admin' | translate }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
</app-bottom-sheet>
